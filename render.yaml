services:
  - type: web
    name: app-financas-pessoais
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: GMAIL_USER
        value: marianosanto33@gmail.com
      - key: NODE_ENV
        value: production
      - key: KEEP_ALIVE_INTERVAL
        value: "7"
      - key: RENDER_EXTERNAL_URL
        value: https://app-financas-pessoais.onrender.com
